<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .tablou-mare{
      display:grid;
      height: 748px;
      width: 748px;
      grid-template-rows:414px 296px;
      grid-template-columns:320px 419px;
      background-color: #000;
      gap:9px;
    }
    body{
      display:flex;
      height: 100vh;
    }
    .red{
      background-color: #E72F24;
    }
    .white{
      background-color:#F0F1EC ;
    }
    .container-mic{
      display:grid;
      grid-template-rows:130px 155px 22px;
      grid-template-columns:198px 153px 50px;
      gap:9px;
    }
    .prim-mare{
      grid-area:1/1/3/3
    }
    .yellow{
      background-color: #F9D01E;
    }
    .black{
      background-color: #232629;
    }
    .blue{
      background-color: #004592;
    }
    .lung{
      grid-row:span 2;
    }
    body{
      display:flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="tablou-mare">
      <div class="red"></div>
      <div class="white"></div>
      <div class="white"></div>
      <div class="container-mic">
        <div class="white prim-mare">
        </div>
          <div class="blue"></div>
          <div class="white lung"></div>
          <div class="yellow"></div>
          <div class="black"></div>
      </div>
   </div>
</body>

</html>
