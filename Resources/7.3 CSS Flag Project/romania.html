<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Romania flag</title>
    <style>
      #blue-part {
        background-color: blue;
        position: absolute;
        left: 0px;
        top: 0px;
      }
      #yellow-part {
        background-color: yellow;
        position: absolute;
        left: 250px;
        top: 0px;
      }
      #red-part {
        background-color: red;
        position: absolute;
        left: 500px;
        top: 0px;
      }
      div {
        width: 250px;
        height: 600px;
      }
    </style>
  </head>
  <body>
    <div id="blue-part"></div>
    <div id="yellow-part"></div>
    <div id="red-part"></div>
  </body>
</html>
